# Formatting hooks follow NVDA's .pre-commit-config.yaml (ref/nvda).
# Install the Git hooks with prek, as NVDA does (ref/nvda/projectDocs/testing/automated.md): `prek install`.
# The lint hook applies safe fixes and fails that commit; stage the fixes and commit again.
# Formatting and lint hooks cover the add-on sources and the tests.
exclude: |
  (?x)^addon/synthDrivers/WorldVoice/(
    # Original upstream engine drivers; WorldVoice never modifies them.
    driver/[^/]+/driver/ |
    # NVDA's sonic binding, copied as is; WorldVoice never modifies it.
    driver/sonic/ |
    # Generated by tools/generate_unicode_scripts.py.
    unicodeScripts/script_data\.py$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml
      # Removes trailing whitespace.
      - id: trailing-whitespace
        files: ^(addon|tests)/
        types_or: [python]
      # Ensures all files end in 1 (and only 1) newline.
      - id: end-of-file-fixer
        files: ^(addon|tests)/
        types_or: [python]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      # Ruff preserves indent/new-line formatting of function arguments, list items, and similar iterables,
      # if a trailing comma is added.
      # This adds a trailing comma to args/iterable items in case it was missed.
      - id: add-trailing-comma
        files: ^(addon|tests)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the Ruff version used by NVDA and required-version in pyproject.toml.
    rev: v0.16.3
    hooks:
      - id: ruff
        name: lint with ruff
        args: [ --fix ]
        files: ^(addon|tests)/
      - id: ruff-format
        name: format with ruff
        files: ^(addon|tests)/
