# Formatting hooks follow NVDA's .pre-commit-config.yaml (ref/nvda).
# Formatting hooks only touch add-on sources; tests keep their own style.
exclude: |
  (?x)^addon/synthDrivers/WorldVoice/(
    # Original upstream engine drivers; WorldVoice never modifies them.
    driver/[^/]+/driver/ |
    # Generated by tools/generate_unicode_scripts.py.
    languageDetection/script_data\.py$
  )

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-yaml
      # Removes trailing whitespace.
      - id: trailing-whitespace
        files: ^addon/
        types_or: [python]
      # Ensures all files end in 1 (and only 1) newline.
      - id: end-of-file-fixer
        files: ^addon/
        types_or: [python]

  - repo: https://github.com/asottile/add-trailing-comma
    rev: v4.0.0
    hooks:
      # Ruff preserves indent/new-line formatting of function arguments, list items, and similar iterables,
      # if a trailing comma is added.
      # This adds a trailing comma to args/iterable items in case it was missed.
      - id: add-trailing-comma
        files: ^addon/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Matches the Ruff version used by NVDA.
    rev: v0.16.3
    hooks:
      # NVDA also runs `ruff --fix` here. WorldVoice omits the lint hook until
      # the existing lint findings are cleaned up; otherwise every commit that
      # touches one of those files would be blocked.
      - id: ruff-format
        name: format with ruff
        files: ^addon/
