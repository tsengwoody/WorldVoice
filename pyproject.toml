[dependency-groups]
# Development only; the add-on itself is packaged by scons. Install with
# `pip install --group test` (pip 25.1 or later) or `uv sync --group test`.
test = [
	"pytest==9.1.1",
	"coverage==7.16.2",
	"pytest-cov==7.1.0",
	"hypothesis==6.168.5",
	# mutmut 3 does not run on native Windows; use WSL or Linux.
	"mutmut==3.8.0",
]

[tool.coverage.run]
# coverage's default core on Python 3.14+ is sys.monitoring; with tests that reload the add-on's
# modules for every test it peaked near 1.9 GB for one full run, against about 330 MB with the
# C tracer at the same speed and the same results (measured 2026-10-06, coverage 7.16.2).
core = "ctrace"
branch = true
source = ["addon"]
omit = [
	# The same vendored code ruff leaves alone.
	"addon/synthDrivers/WorldVoice/driver/*/driver/*",
	"addon/synthDrivers/WorldVoice/driver/sonic/*",
	"addon/synthDrivers/WorldVoice/unicodeScripts/script_data.py",
]

[tool.coverage.report]
skip_empty = true
# addon/ and its top-level folders have no __init__.py; without this a module no test imports
# would be left out of the report instead of showing 0%.
include_namespace_packages = true

[tool.pytest.ini_options]
# A deprecated call fails the test that makes it. One made at import time (a test module,
# conftest.py, an add-on module or NVDA stub imported at module level) aborts collection, so the
# whole run stops. pytest's own PytestDeprecationWarning is a DeprecationWarning and fails too.
# Escape hatches: a @pytest.mark.filterwarnings("ignore:<message start>:DeprecationWarning") mark
# on the test, as tests/test_pipeline_nvda_symbols.py does for NVDA's codecs.open (marks take
# precedence over this list), or a narrow "ignore::DeprecationWarning:<module>" entry below.
filterwarnings = ["error::DeprecationWarning"]

[tool.mutmut]
# Run with `mutmut run` (Linux or WSL), then `mutmut results` / `mutmut show <name>`.
# Covered lines of the core decision logic only; widen the list as needed.
source_paths = [
	"addon/synthDrivers/WorldVoice/runtime/completion.py",
	"addon/synthDrivers/WorldVoice/bridge/indexLedger.py",
	"addon/synthDrivers/WorldVoice/bridge/indexCodec.py",
	"addon/synthDrivers/WorldVoice/bridge/engineAdapter.py",
	"addon/synthDrivers/WorldVoice/voices/settingsRepository.py",
	"addon/synthDrivers/WorldVoice/voices/mainLocalePolicy.py",
	"addon/synthDrivers/WorldVoice/voices/roles.py",
	"addon/synthDrivers/WorldVoice/voices/engineFilter.py",
	"addon/synthDrivers/WorldVoice/pipeline/registry.py",
	"addon/synthDrivers/WorldVoice/pipeline/breaks.py",
	"addon/synthDrivers/WorldVoice/pipeline/sequence.py",
	"addon/synthDrivers/WorldVoice/pipeline/items.py",
	"addon/synthDrivers/WorldVoice/pipeline/numberStages.py",
	"addon/synthDrivers/WorldVoice/pipeline/punctuation.py",
	"addon/synthDrivers/WorldVoice/pipeline/unspaced.py",
	"addon/synthDrivers/WorldVoice/pipeline/languageCommands.py",
	"addon/synthDrivers/WorldVoice/pipeline/numbers.py",
	"addon/synthDrivers/WorldVoice/pipeline/symbols.py",
	"addon/synthDrivers/WorldVoice/pipeline/settings.py",
	"addon/synthDrivers/WorldVoice/ui/panelLayout.py",
	"addon/synthDrivers/WorldVoice/ui/controls.py",
	"addon/synthDrivers/WorldVoice/languageDetection/detector.py",
]
mutate_only_covered_lines = true
# tools/ for tests/test_generate_unicode_scripts.py and tests/test_generate_unspaced_common.py,
# which load the generators.
also_copy = ["addon/", ".pre-commit-config.yaml", "buildVars.py", "tools/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The hygiene guards lint and scan the source; on mutmut's rewritten copy they judge the
# rewrite, not behaviour. tests/mutation_support.py matches the alias-loaded modules.
pytest_add_cli_args = ["--ignore=tests/test_hygiene_guards.py"]

[tool.ruff]
# Matches the ruff-pre-commit rev in .pre-commit-config.yaml and NVDA's lint group (ref/nvda/pyproject.toml).
# The lint rules are ruff's defaults minus the ignores below, so another ruff version could check other rules.
required-version = "==0.16.3"
line-length = 110

builtins = [
	# translation lookup
	"_",
	# translation lookup
	"ngettext",
	# translation lookup
	"pgettext",
	# translation lookup
	"npgettext",
]

include = [
	"*.py",
	"sconstruct",
]

exclude = [
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
	# Original upstream engine drivers; WorldVoice never modifies them.
	"./addon/synthDrivers/WorldVoice/driver/*/driver",
	# NVDA's sonic binding, copied as is; WorldVoice never modifies it.
	"./addon/synthDrivers/WorldVoice/driver/sonic",
	# Generated by tools/generate_unicode_scripts.py.
	"./addon/synthDrivers/WorldVoice/unicodeScripts/script_data.py",
]

[tool.ruff.format]
indent-style = "tab"
line-ending = "lf"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint]
# NVDA's logger, as in ref/nvda/pyproject.toml: handlers that log through it are not blind.
logger-objects = ["logHandler.log"]
ignore = [
	# indentation contains tabs
	"W191",
	# lower snake case module names, we use lowerCamelCase instead
	"N999",
	# log.error(..., exc_info=True) stays: NVDA's log.exception lowers expected Windows/COM errors
	# to debugWarning (ref/nvda/source/logHandler.py), and WorldVoice wants these at ERROR.
	# NVDA keeps the same calls with inline noqa.
	"G201",
	# S110 only reports handlers that BLE001 or E722 already report (it checks bare, Exception and
	# BaseException handlers only), and WorldVoice's noqa: BLE001 must also say where the error goes
	# (tests/test_hygiene_guards.py). A second noqa would repeat it; NVDA writes noqa: BLE001, S110.
	"S110",
]
extend-unsafe-fixes = [
	# Sort imports
	"I001",
]

[tool.ruff.lint.isort]
# Keep `from x import (a, b as c)` as one statement.
combine-as-imports = true

[tool.ruff.lint.per-file-ignores]
# sconstruct contains many inbuilt functions not recognised by the lint,
# so ignore F821.
"sconstruct" = ["F821"]
# ValueError is the runtime boundary's contract for rejected speech commands, pinned by tests
# (test_legacy_speech_commands, test_index_codec, test_runtime_legacy_adapter); TypeError would
# change the API. NVDA keeps the same raises with inline noqa: TRY004.
"addon/synthDrivers/WorldVoice/bridge/commands.py" = ["TRY004"]
"addon/synthDrivers/WorldVoice/bridge/engineAdapter.py" = ["TRY004"]
"addon/synthDrivers/WorldVoice/bridge/indexCodec.py" = ["TRY004"]
# Tests run parts of the add-on that need wx or NVDA by extracting their source with ast and
# running it through exec against stub namespaces. tests/addon_loader.py (load_definitions) does
# that for every test but load_synth in tests/pipeline_harness.py, which also runs the
# module-level loop after the driver class.
"tests/addon_loader.py" = ["S102"]
"tests/pipeline_harness.py" = ["S102"]

[tool.pyright]
pythonPlatform = "Windows"
typeCheckingMode = "strict"

include = [
	"**/*.py",
]

exclude = [
	"sconstruct",
	".git",
	"__pycache__",
	# When excluding concrete paths relative to a directory,
	# not matching multiple folders by name e.g. `__pycache__`,
	# paths are relative to the configuration file.
]

# Tell pyright where to load python code from
extraPaths = [
	"./addon",
]

# General config
analyzeUnannotatedFunctions = true
deprecateTypingAliases = true

# Stricter typing
strictParameterNoneValue = true
strictListInference = true
strictDictionaryInference = true
strictSetInference = true

# Compliant rules
reportAbstractUsage = true
reportArgumentType = true
reportAssertAlwaysTrue = true
reportAssertTypeFailure = true
reportAssignmentType = true
reportAttributeAccessIssue = true
reportCallInDefaultInitializer = true
reportCallIssue = true
reportConstantRedefinition = true
reportDuplicateImport = true
reportFunctionMemberAccess = true
reportGeneralTypeIssues = true
reportImplicitOverride = true
reportImplicitStringConcatenation = true
reportImportCycles = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportIncompleteStub = true
reportInconsistentConstructor = true
reportInconsistentOverload = true
reportIndexIssue = true
reportInvalidStringEscapeSequence = true
reportInvalidStubStatement = true
reportInvalidTypeArguments = true
reportInvalidTypeForm = true
reportInvalidTypeVarUse = true
reportMatchNotExhaustive = true
reportMissingImports = true
reportMissingModuleSource = true
reportMissingParameterType = true
reportMissingSuperCall = true
reportMissingTypeArgument = true
reportNoOverloadImplementation = true
reportOperatorIssue = true
reportOptionalCall = true
reportOptionalContextManager = true
reportOptionalIterable = true
reportOptionalMemberAccess = true
reportOptionalOperand = true
reportOptionalSubscript = true
reportOverlappingOverload = true
reportPossiblyUnboundVariable = true
reportPrivateImportUsage = true
reportPrivateUsage = true
reportPropertyTypeMismatch = true
reportRedeclaration = true
reportReturnType = true
reportSelfClsParameterName = true
reportShadowedImports = true
reportTypeCommentUsage = true
reportTypedDictNotRequiredAccess = true
reportUnboundVariable = true
reportUndefinedVariable = true
reportUnhashable = true
reportUninitializedInstanceVariable = true
reportUnknownArgumentType = true
reportUnknownLambdaType = true
reportUnknownMemberType = true
reportUnknownParameterType = true
reportUnknownVariableType = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnnecessaryIsInstance = true
reportUnnecessaryTypeIgnoreComment = true
reportUnsupportedDunderAll = true
reportUntypedBaseClass = true
reportUntypedClassDecorator = true
reportUntypedFunctionDecorator = true
reportUntypedNamedTuple = true
reportUnusedCallResult = true
reportUnusedClass = true
reportUnusedCoroutine = true
reportUnusedExcept = true
reportUnusedExpression = true
reportUnusedFunction = true
reportUnusedImport = true
reportUnusedVariable = true
reportWildcardImportFromLibrary = true

reportDeprecated = true

# Can be enabled by generating type stubs for modules via pyright CLI
reportMissingTypeStubs = false

# Bad rules
# These are sorted alphabetically and should be enabled and moved to compliant rules section when resolved.
